[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hapgwas"
version = "0.7.2"
description = "Haplotype GWAS under one LMM: Cauchy omnibus, exact nested block likelihood ratio, and a SNP scan"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hapGWAS contributors"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hapgwas = "hapgwas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hapgwas*"]
